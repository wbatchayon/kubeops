name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least-privilege default token; jobs that need more elevate explicitly
permissions:
  contents: read

env:
  GO_VERSION: '1.21'
  TERRAFORM_VERSION: '1.6.0'
  ANSIBLE_VERSION: '2.14'

jobs:
  # Stage 1: Validation
  validate:
    name: 1-Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate YAML files
        run: yamllint -c .yamllint.yaml .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check Go formatting
        run: |
          test -z "$(gofmt -l .)" || { echo "Files need gofmt:"; gofmt -l .; exit 1; }
          go vet ./...

  # Stage 2: Build
  build:
    name: 2-Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: |
          go build -o bin/kubeops ./cmd/kubeops

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubeops-binary
          path: bin/kubeops

  # Stage 3: Unit Tests
  test-unit:
    name: 3-Unit-Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: |
          go test -short -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # Stage 4: Integration Tests
  test-integration:
    name: 4-Integration-Tests
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run integration tests
        run: |
          if [ -d test/integration ]; then
            go test -tags=integration ./test/integration/...
          else
            echo "No integration tests yet (test/integration/ missing), skipping."
          fi

  # Stage 5: Security Scan
  security:
    name: 5-Security
    runs-on: ubuntu-latest
    needs: test-unit
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Stage 6: Terraform Validation
  terraform-validate:
    name: 6-Terraform
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive terraform/

      - name: Terraform Init
        run: |
          cd terraform/environments/dev
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd terraform/environments/dev
          terraform validate

  # Stage 7: Ansible Lint
  ansible-lint:
    name: 7-Ansible-Lint
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Run Ansible Lint
        run: ansible-lint ansible/
        continue-on-error: true

  # Stage 8: Packaging
  packaging:
    name: 8-Packaging
    runs-on: ubuntu-latest
    needs: [build, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries for multiple platforms
        run: |
          GOOS=linux GOARCH=amd64 go build -o bin/kubeops-linux-amd64 ./cmd/kubeops
          GOOS=darwin GOARCH=amd64 go build -o bin/kubeops-darwin-amd64 ./cmd/kubeops
          GOOS=windows GOARCH=amd64 go build -o bin/kubeops-windows-amd64.exe ./cmd/kubeops

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: bin/

  # Stage 9: E2E Tests
  test-e2e:
    name: 9-E2E-Tests
    runs-on: ubuntu-latest
    needs: packaging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run E2E tests
        run: |
          if [ -d test/e2e ]; then
            go test -tags=e2e ./test/e2e/...
          else
            echo "No E2E tests yet (test/e2e/ missing), skipping."
          fi

  # Stage 10: Deploy Test Environment
  deploy-test:
    name: 10-Deploy-Test
    runs-on: ubuntu-latest
    needs: [terraform-validate, ansible-lint]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to test environment
        run: |
          echo "Deploying to test environment..."
        continue-on-error: true

  # Stage 11: Monitoring Health Check
  monitoring:
    name: 11-Monitoring
    runs-on: ubuntu-latest
    needs: deploy-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Prometheus metrics
        run: |
          echo "Checking monitoring stack..."
        continue-on-error: true

  # Stage 12: Feedback
  feedback:
    name: 12-Feedback
    runs-on: ubuntu-latest
    needs: monitoring
    if: always()
    steps:
      - name: Generate build report
        run: |
          echo "Build completed"
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Validation: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test-unit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack on failure
        if: failure()
        # Third-party action handling a secret: pinned to a full commit SHA
        uses: 8398a7/action-slack@047b09b154480ed39076984b64f324fff010d703  # v3.9.3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
