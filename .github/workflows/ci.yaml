name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least-privilege default token; jobs that need more elevate explicitly
permissions:
  contents: read

env:
  GO_VERSION: '1.21'
  # 1.6.0 crashes on sensitive values in conditionals ("value is marked" panic)
  TERRAFORM_VERSION: '1.14.7'
  ANSIBLE_VERSION: '2.14'

jobs:
  # Stage 1: Validation
  validate:
    name: 1-Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate YAML files
        run: yamllint -c .yamllint.yaml .

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check Go formatting
        run: |
          test -z "$(gofmt -l .)" || { echo "Files need gofmt:"; gofmt -l .; exit 1; }
          go vet ./...

  # Stage 2: Airgap Guard — no internet dependency may reach the cluster,
  # and nothing besides the Gateway's 443 listener may be exposed
  airgap-guard:
    name: 2-Airgap-Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check air-gap compliance
        run: ./scripts/airgap-guard.sh

  # Stage 3: Helm and Kubernetes manifest validation.
  # CI runs outside the air-gapped perimeter: pulling the upstream charts
  # here only validates our values; the cluster itself pulls from Harbor.
  helm-validate:
    name: 3-Helm-Validate
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Lint local charts
        run: helm lint helm-charts/base-chart

      - name: Render vendor charts with our values
        # repo/chart references: a bare chart name would resolve to the
        # repo directories of the same name (cilium/, harbor/, ...)
        run: |
          helm repo add cilium https://helm.cilium.io
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add goharbor https://helm.goharbor.io
          helm repo add jetstack https://charts.jetstack.io
          helm template cilium cilium/cilium --version 1.14.5 \
            -f cilium/base/values.yaml > /dev/null
          helm template monitoring prometheus-community/kube-prometheus-stack \
            --version 55.5.0 -f monitoring/prometheus/values.yaml > /dev/null
          helm template harbor goharbor/harbor --version 1.14.2 \
            -f harbor/base/values.yaml > /dev/null
          helm template cert-manager jetstack/cert-manager --version v1.13.6 \
            -f cert-manager/base/values.yaml > /dev/null

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Validate raw manifests (kubeconform)
        # Version pinned through the Go module proxy (checksum-verified),
        # consistent with the repo's no-unverified-downloads policy
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.4
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main'
          "$(go env GOPATH)/bin/kubeconform" -strict -summary \
            -schema-location default \
            -schema-location "${crds}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            gateway-api/ cert-manager/manifests/ harbor/manifests/ \
            argo-cd/apps/ argo-cd/applications/ argo-cd/projects/

  # Stage 4: Build
  build:
    name: 4-Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: |
          go build -o bin/kubeops ./cmd/kubeops

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: kubeops-binary
          path: bin/kubeops

  # Stage 5: Unit Tests
  test-unit:
    name: 5-Unit-Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: |
          go test -short -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.out

  # Stage 6: Integration Tests
  test-integration:
    name: 6-Integration-Tests
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run integration tests
        run: |
          if [ -d test/integration ]; then
            go test -tags=integration ./test/integration/...
          else
            echo "No integration tests yet (test/integration/ missing), skipping."
          fi

  # Stage 7: Security Scan
  security:
    name: 7-Security
    runs-on: ubuntu-latest
    needs: test-unit
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        # Third-party action: pinned to the commit behind tag v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # Stage 8: Terraform Validation
  terraform-validate:
    name: 8-Terraform
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive terraform/

      - name: Terraform Init
        run: |
          cd terraform/environments/dev
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd terraform/environments/dev
          terraform validate

  # Stage 9: Ansible Lint
  ansible-lint:
    name: 9-Ansible-Lint
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Install required collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Ansible Lint
        # Run from ansible/ so ansible.cfg (roles_path) is picked up
        working-directory: ansible
        run: ansible-lint
        continue-on-error: true

  # Stage 10: Packaging
  packaging:
    name: 10-Packaging
    runs-on: ubuntu-latest
    needs: [build, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries for multiple platforms
        run: |
          GOOS=linux GOARCH=amd64 go build -o bin/kubeops-linux-amd64 ./cmd/kubeops
          GOOS=darwin GOARCH=amd64 go build -o bin/kubeops-darwin-amd64 ./cmd/kubeops
          GOOS=windows GOARCH=amd64 go build -o bin/kubeops-windows-amd64.exe ./cmd/kubeops

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-artifacts
          path: bin/

  # Stage 11: E2E Tests
  test-e2e:
    name: 11-E2E-Tests
    runs-on: ubuntu-latest
    needs: packaging
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run E2E tests
        run: |
          if [ -d test/e2e ]; then
            go test -tags=e2e ./test/e2e/...
          else
            echo "No E2E tests yet (test/e2e/ missing), skipping."
          fi

  # Stage 12: Deploy Test Environment
  deploy-test:
    name: 12-Deploy-Test
    runs-on: ubuntu-latest
    needs: [terraform-validate, ansible-lint]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to test environment
        run: |
          echo "Deploying to test environment..."
        continue-on-error: true

  # Stage 13: Monitoring Health Check
  monitoring:
    name: 13-Monitoring
    runs-on: ubuntu-latest
    needs: deploy-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check Prometheus metrics
        run: |
          echo "Checking monitoring stack..."
        continue-on-error: true

  # Stage 14: Feedback
  feedback:
    name: 14-Feedback
    runs-on: ubuntu-latest
    # Every job referenced in the summary must be listed in needs for its
    # result to resolve
    needs: [monitoring, validate, airgap-guard, helm-validate, build, test-unit, security]
    if: always()
    steps:
      - name: Generate build report
        run: |
          echo "Build completed"
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Validation: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Airgap guard: ${{ needs.airgap-guard.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Helm/manifests: ${{ needs.helm-validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test-unit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack on failure
        if: failure()
        # Third-party action handling a secret: pinned to a full commit SHA
        uses: 8398a7/action-slack@047b09b154480ed39076984b64f324fff010d703  # v3.9.3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
