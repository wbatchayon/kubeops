name: Release

on:
  push:
    tags:
      - 'v*'

# Least-privilege default token; jobs elevate explicitly
permissions:
  contents: read

env:
  GO_VERSION: '1.21'

jobs:
  goreleaser:
    name: 1-GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release and upload assets
      packages: write   # push the container image to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # GoReleaser needs the full history and tags for the changelog
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Login to GHCR
        # Third-party action handling a secret: pinned to a full commit SHA
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        # Third-party action: pinned to the commit behind tag v7.2.3
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm-chart:
    name: 2-Helm-Chart
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      packages: write   # push the chart to GHCR (OCI)
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Push base-chart to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${GITHUB_REF_NAME#v}"
          helm package helm-charts/base-chart --version "$version" --app-version "$version"
          helm push "base-chart-${version}.tgz" oci://ghcr.io/wbatchayon/charts
