---
# Common role - tasks that apply to all nodes

- name: Disable swap
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: ansible_swaptotal_mb > 0

- name: Comment out swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n]*\sswap\s+sw\s+.*)$'
    replace: '# \1'

- name: Disable selinux (RHEL/CentOS)
  ansible.builtin.command: setenforce 0
  when: ansible_os_family == "RedHat"
  failed_when: false
  changed_when: true

- name: Set SELinux to permissive (RHEL/CentOS)
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=permissive'
  when: ansible_os_family == "RedHat"

- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ common_kernel_modules }}"

- name: Configure sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
  loop: "{{ common_sysctl_params | dict2items }}"

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install required packages (RHEL)
  ansible.builtin.dnf:
    name:
      - yum-utils
      - device-mapper-persistent-data
      - lvm2
    state: present
  when: ansible_os_family == "RedHat"

- name: Create apt keyrings directory (Debian)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_os_family == "Debian"

- name: Add Kubernetes apt repository key (Debian)
  ansible.builtin.get_url:
    url: "{{ common_kubernetes_repo_base_url }}/core:/stable:/v{{ common_kubernetes_repo_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'
  when: ansible_os_family == "Debian"

- name: Add Kubernetes apt repository (Debian)
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc]
      {{ common_kubernetes_repo_base_url }}/core:/stable:/v{{ common_kubernetes_repo_version }}/deb/ /
    state: present
  when: ansible_os_family == "Debian"

- name: Add Kubernetes RPM repository (RHEL)
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: "{{ common_kubernetes_repo_base_url }}/core:/stable:/v{{ common_kubernetes_repo_version }}/rpm/"
    gpgkey:
      - >-
        {{ common_kubernetes_repo_base_url }}/core:/stable:/v{{
        common_kubernetes_repo_version }}/rpm/repodata/repomd.xml.key
    gpgcheck: true
    enabled: true
  when: ansible_os_family == "RedHat"

- name: Install Kubernetes binaries
  ansible.builtin.apt:
    name:
      - kubelet={{ common_kubernetes_package_version }}
      - kubeadm={{ common_kubernetes_package_version }}
      - kubectl={{ common_kubernetes_package_version }}
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install Kubernetes binaries (RHEL)
  ansible.builtin.dnf:
    name:
      - kubelet-{{ kubernetes_version }}
      - kubeadm-{{ kubernetes_version }}
      - kubectl-{{ kubernetes_version }}
    state: present
    disable_excludes: kubernetes
  when: ansible_os_family == "RedHat"

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  when: ansible_os_family == "Debian"

- name: Enable and start kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: started
    enabled: true

# Internal PKI trust: containerd validates the Harbor mirror's TLS
# certificate against the node trust store (airgap mode)
- name: Install internal CA certificate (Debian)
  ansible.builtin.copy:
    content: "{{ common_internal_ca_cert }}"
    dest: /usr/local/share/ca-certificates/kubeops-ca.crt
    mode: '0644'
  when:
    - ansible_os_family == "Debian"
    - common_internal_ca_cert | length > 0
  notify: Update CA trust store (Debian)

- name: Install internal CA certificate (RHEL)
  ansible.builtin.copy:
    content: "{{ common_internal_ca_cert }}"
    dest: /etc/pki/ca-trust/source/anchors/kubeops-ca.crt
    mode: '0644'
  when:
    - ansible_os_family == "RedHat"
    - common_internal_ca_cert | length > 0
  notify: Update CA trust store (RHEL)
