---
# Containerd role - Install and configure containerd

- name: Install containerd dependencies
  ansible.builtin.apt:
    name:
      - libseccomp2
      - libgpgme0
      - libbtrfs0
      - libdevmapper1
    state: present
  when: ansible_os_family == "Debian"

- name: Install containerd dependencies (RHEL)
  ansible.builtin.dnf:
    name:
      - libseccomp
      - device-mapper-persistent-data
      - lvm2
    state: present
  when: ansible_os_family == "RedHat"

- name: Download containerd tarball
  ansible.builtin.get_url:
    url: "{{ containerd_release_url }}/{{ containerd_tarball }}"
    dest: "/tmp/{{ containerd_tarball }}"
    checksum: "sha256:{{ containerd_release_url }}/{{ containerd_tarball }}.sha256sum"
    mode: '0644'
  register: containerd_download

- name: Extract containerd
  ansible.builtin.unarchive:
    src: "/tmp/{{ containerd_tarball }}"
    dest: /usr/local
    remote_src: true
    creates: /usr/local/bin/containerd

# Unit file vendored from containerd v1.7.13 (Apache-2.0) rather than
# downloaded at run time, so its content is reviewed and integrity-guaranteed
- name: Install containerd systemd service
  ansible.builtin.copy:
    src: containerd.service
    dest: /etc/systemd/system/containerd.service
    mode: '0644'
  register: containerd_service
  notify: Restart containerd

- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Create containerd config
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: |
      version = 2

      [plugins]
        [plugins."io.containerd.grpc.v1.cri"]
          sandbox_image = "registry.k8s.io/pause:3.9"
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
          runtime_type = "io.containerd.runc.v2"
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
            SystemdCgroup = true
    mode: '0644'
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
    daemon_reload: true
