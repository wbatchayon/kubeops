[defaults]
inventory = inventory/hosts.yaml
roles_path = roles
; Host keys are accepted on first contact and pinned in a dedicated file;
; delete ~/.ssh/known_hosts.kubeops when re-provisioning VMs
host_key_checking = True
retry_files_enabled = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600
stdout_callback = yaml
bin_ansible_callbacks = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts.kubeops
pipelining = True
