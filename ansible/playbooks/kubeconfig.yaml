---
# Kubeconfig distribution playbook
# Distributes kubeconfig from control plane to other nodes

- name: Distribute kubeconfig
  hosts: control_plane
  become: true
  gather_facts: true

  tasks:
    - name: Check if kubeconfig exists
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: kubeconfig_stat

    - name: Read kubeconfig
      ansible.builtin.slurp:
        src: /etc/kubernetes/admin.conf
      register: kubeconfig_content
      when: kubeconfig_stat.stat.exists

    - name: Create .kube directory for root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: kubeconfig_stat.stat.exists

    - name: Copy kubeconfig to root
      ansible.builtin.copy:
        content: "{{ kubeconfig_content.content | b64decode }}"
        dest: /root/.kube/config
        owner: root
        group: root
        mode: '0600'
      when: kubeconfig_stat.stat.exists

- name: Join worker nodes
  hosts: worker
  become: true
  gather_facts: true

  tasks:
    - name: Check if node is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Generate kubeadm join command on first control plane
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command
      changed_when: true
      no_log: true
      delegate_to: "{{ groups['control_plane'][0] }}"
      when: not kubelet_conf.stat.exists

    - name: Join worker node to cluster
      ansible.builtin.command: "{{ join_command.stdout }}"
      register: join_result
      changed_when: true
      no_log: true
      when: not kubelet_conf.stat.exists

    - name: Enable kubelet service
      ansible.builtin.systemd:
        name: kubelet
        state: started
        enabled: true
