# Argo CD Root Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kubeops
  source:
    repoURL: https://github.com/wbatchayon/kubeops.git
    targetRevision: main
    path: argo-cd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # prune disabled on the app-of-apps: removing a child Application file in git
      # must not cascade into deleting cluster components (CNI, monitoring, ...).
      # Delete child apps manually after review.
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
