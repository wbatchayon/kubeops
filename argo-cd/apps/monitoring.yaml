# Argo CD Application: kube-prometheus-stack (Prometheus, Alertmanager, Grafana)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kubeops
  sources:
    # kube-prometheus-stack chart served from Harbor (seeded, see docs/airgap.md)
    - repoURL: harbor.kubeops.local/charts
      chart: kube-prometheus-stack
      targetRevision: 55.5.0
      helm:
        valueFiles:
          - $values/monitoring/prometheus/values.yaml
    - repoURL: https://github.com/wbatchayon/kubeops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Required for the large kube-prometheus-stack CRDs
      - ServerSideApply=true
