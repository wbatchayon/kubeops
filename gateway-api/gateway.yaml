# Gateway API Gateway Configuration
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
spec:
  controllerName: io.cilium/gateway-controller
---
# Gateway Definition
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kubeops-gateway
  namespace: kube-system
  annotations:
    # cert-manager must run with Gateway API support enabled (--enable-gateway-api)
    # for the kubeops-tls certificate secret to be issued
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # HTTP only serves the HTTPS redirect route below (same namespace)
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          # Only namespaces labeled gateway-access: "true" may attach routes
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: kubeops-tls
            group: ""
---
# Redirect all plain HTTP traffic to HTTPS
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: kubeops-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
