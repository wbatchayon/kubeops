# Gateway API Gateway Configuration
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
spec:
  controllerName: io.cilium/gateway-controller
---
# Gateway Definition
#
# Strict 443-only policy: no HTTP listener at all — plain HTTP is not even
# answered with a redirect. Clients must use https:// explicitly.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kubeops-gateway
  namespace: kube-system
  annotations:
    # Certificates are issued by the internal PKI (airgap: ACME is
    # unreachable). cert-manager must run with --enable-gateway-api for
    # the kubeops-tls certificate secret to be issued.
    cert-manager.io/cluster-issuer: kubeops-ca
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          # Only namespaces labeled gateway-access: "true" may attach routes
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: kubeops-tls
            group: ""
